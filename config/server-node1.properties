# ===================================================================
# BIFROX EVENT STREAMING STORAGE ENGINE - KAFKA STYLE CONFIGURATION
# Node 1 Configuration (Leader)
# ===================================================================

# Cluster Membership ID (KRaft style cluster.id)
cluster.id=bifrox-prod-cluster-01

# Broker/Node ID in the HA cluster
node.id=1

# HA Role: leader or follower
role=leader

# The address the socket server listens on (Kafka style listeners format)
listeners=PLAINTEXT://127.0.0.1:9092

# Directory under which log data files are kept
log.dirs=./data_node1

# Directory under which diagnostic server log files are written
logs.dir=./logs_node1

# The maximum size of a segment file in bytes
max.segment.bytes=10485760

# The byte interval for sparse index entries
index.interval.bytes=4096

# Peer node socket addresses for HA replication stream
replica.peer.addresses=127.0.0.1:9093,127.0.0.1:9094

# Minimum in-sync replicas (ISR) required before write commit acknowledgment
min.insync.replicas=1

# Retention policy settings
log.retention.bytes=104857600
log.retention.ms=86400000
