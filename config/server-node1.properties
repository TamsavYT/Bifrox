# ===================================================================
# BIFROX EVENT STREAMING STORAGE ENGINE - CONFIGURATION
# Node 1 Configuration (Leader)
# ===================================================================

# Cluster Membership ID (cluster.id)
cluster.id=bifrox-prod-cluster-01

# Broker/Node ID in the HA cluster
node.id=1

# HA Role: leader or follower
role=leader

# The address the socket server listens on (`listeners` format)
listeners=PLAINTEXT://127.0.0.1:9092

# Directory under which log data files are kept
log.dirs=./data_node1

# Directory under which diagnostic server log files are written
logs.dir=./logs_node1

# The maximum size of a segment file in bytes
max.segment.bytes=10485760

# The byte interval for sparse index entries
index.interval.bytes=4096

# Peer node socket addresses for HA replication stream
replica.peer.addresses=127.0.0.1:9093,127.0.0.1:9094

# Minimum in-sync replicas (ISR) required before write commit acknowledgment
min.insync.replicas=1

# Retention policy settings
log.retention.bytes=104857600
log.retention.ms=86400000

# ===================================================================
# Share Groups (queue-style consumption)
# ===================================================================

# How long an acquired record is leased to a share-group member before it becomes
# eligible for redelivery to someone else. Also what a member gets when its ShareFetch
# sends lock_timeout_ms=0 (declining to pick its own duration).
share.group.lock.timeout.ms=30000

# How many delivery attempts a share-group record gets before it is archived and routed
# to <topic>-dlq instead of being redelivered again. 1 means no retries.
share.group.max.delivery.attempts=5

# How hard share-group state is pushed to disk on every acquire/acknowledge/sweep:
# buffered (default) = OS page cache only, survives a process restart but not a machine
# crash; always = fsync every write, fully crash-durable but caps share-group throughput;
# interval = fsync at most once per share.group.state.sync.interval.ms, bounding crash
# loss without paying a sync on every write.
share.group.state.sync=buffered

# Sync window used only when share.group.state.sync=interval. Setting this key by itself
# also switches the policy to interval, so it is left commented out here to keep the
# buffered default above in effect; uncomment it alongside share.group.state.sync=interval.
#share.group.state.sync.interval.ms=1000
