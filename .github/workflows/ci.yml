name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build_and_test:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Validate Windows packaging syntax
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        Get-ChildItem packaging/windows/*.ps1 | ForEach-Object {
          $parseErrors = $null
          $tokens = $null
          [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count -gt 0) { throw ($parseErrors | Out-String) }
        }
        [xml](Get-Content packaging/windows/winsw.xml -Raw) | Out-Null

    - name: Set up Rust Toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy

    - name: Cache Cargo Dependencies
      uses: swatinem/rust-cache@v2

    - name: Check Formatting
      run: cargo fmt --all -- --check

    - name: Run Clippy Lints
      run: cargo clippy --all-targets -- -D warnings

    - name: Build Codebase
      run: cargo build --verbose

    - name: Run Integration & Unit Tests
      shell: python {0}
      run: |
        import subprocess
        import sys
        result = subprocess.run(
            ["cargo", "test", "--verbose"],
            stdout=subprocess.PIPE, stderr=subprocess.STDOUT,
            text=True, encoding="utf-8", errors="replace",
        )
        print(result.stdout)
        if result.returncode:
            # Keep the failing assertion visible through the Checks API as well as logs.
            detail = result.stdout[-16000:]
            detail = detail.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
            print("::error title=Rust test failure::" + detail)
        sys.exit(result.returncode)

