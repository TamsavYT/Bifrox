[package]
name = "hermes"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
readme = "README.md"


[dependencies]
tokio = { version = "1.38", features = ["full"] }
bytes = "1.6"
crc32fast = "1.4"
parking_lot = "0.12"
dashmap = "6.0"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
socket2 = "0.5"
memmap2 = "0.9"
tokio-rustls = "0.26"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rustls-pemfile = "2.1"
rcgen = "0.13"
lz4_flex = "0.11"
zstd = "0.13"
webpki-roots = "0.26"
ring = "0.17"
# Vetted constant-time primitives for comparing secret material (SCRAM proofs/keys).
# Purpose-built to resist the compiler reintroducing an early exit, which a hand-rolled
# fold cannot promise. See `scram::constant_time_eq`.
subtle = "2"
base64 = "0.22"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "storage_bench"
harness = false

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = ["Win32_Storage_FileSystem", "Win32_Foundation", "Win32_Networking_WinSock", "Win32_System_IO", "Win32_Security"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"