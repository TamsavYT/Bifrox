[package]
name = "hermes"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.38", features = ["full"] }
bytes = "1.6"
crc32fast = "1.4"
parking_lot = "0.12"
dashmap = "6.0"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
socket2 = "0.5"
memmap2 = "0.9"
tokio-rustls = "0.26"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rustls-pemfile = "2.1"
rcgen = "0.13"
lz4_flex = "0.11"
webpki-roots = "0.26"
ring = "0.17"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = ["Win32_Storage_FileSystem", "Win32_Foundation", "Win32_Networking_WinSock", "Win32_System_IO"] }